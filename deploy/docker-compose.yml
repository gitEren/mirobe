# Mirobe API production stack.
#
# Run from the repo root on the server (/opt/mirobe):
#
#   A) Standalone (nothing else on 80/443): api + bundled Caddy
#        COMPOSE_PROFILES=caddy docker compose -f deploy/docker-compose.yml up -d --build
#
#   B) Behind an existing reverse proxy (nginx/Caddy/Traefik already owns 80/443):
#        API_HOST_PORT=3100 docker compose -f deploy/docker-compose.yml up -d --build api
#      then add a vhost that proxies to 127.0.0.1:3100 (see deploy/nginx-mirobe.conf).
#
# The API is never published on a public interface; the host port binds to 127.0.0.1 only.
# Secrets live in deploy/.env.production (server-side only, chmod 600, gitignored).

name: mirobe

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mirobe-api:latest
    restart: unless-stopped
    # Unprivileged: the image's built-in `node` user (uid 1000) owns the data volume.
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env.production
        required: true
    environment:
      # These override anything in .env.production (a copied dev .env may carry local values).
      NODE_ENV: production
      APP_URL: https://mirobe.orbexastudio.com.tr
      PORT: "3000"
      DATA_DIR: /app/data
    volumes:
      - mirobe-data:/app/data
    ports:
      # Loopback only: for debugging (curl 127.0.0.1:PORT/api/health) or for an existing host proxy.
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      # node:24-slim has no curl/wget.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin CA cert + key; created on the server only (never in git).
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mirobe-data:
  caddy-data:
  caddy-config:
