# Example vhost for an EXISTING nginx on the VPS (alternative B in docker-compose.yml).
# Start only the api service bound to a free loopback port, e.g.:
#   API_HOST_PORT=3100 docker compose -f deploy/docker-compose.yml up -d --build api
# Install: copy to /etc/nginx/sites-available/mirobe.conf (Debian/Ubuntu; symlink into
# sites-enabled) or /etc/nginx/conf.d/mirobe.conf, then `nginx -t && systemctl reload nginx`.
#
# TLS: Cloudflare SSL mode is "Full" (not strict), so any origin certificate works.
# Reuse an existing cert on the box, a Cloudflare Origin CA cert, or a self-signed one:
#   openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
#     -subj "/CN=mirobe.orbexastudio.com.tr" \
#     -keyout /etc/ssl/private/mirobe-selfsigned.key -out /etc/ssl/certs/mirobe-selfsigned.crt

upstream mirobe_api {
    server 127.0.0.1:3100;   # must match API_HOST_PORT
    keepalive 16;
}

server {
    # One block for both: plain HTTP stays served (Cloudflare Flexible also works;
    # Always Use HTTPS is off), HTTPS for Cloudflare Full mode.
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                 # nginx >= 1.25.1; on older nginx use "listen 443 ssl http2;"
    server_name mirobe.orbexastudio.com.tr;

    ssl_certificate     /etc/ssl/certs/mirobe-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/mirobe-selfsigned.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://mirobe_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;   # Cloudflare free cuts at ~100 s; origin must not cut first
        proxy_buffering off;
    }
}
